server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # BACKEND_URL se configura según el entorno:
    #   VPS (mismo docker-compose): http://backend:8000  — resolver Docker interno necesario
    #   Raspberry Pi (dashboard solo): http://161.132.53.226:8001  — quitar la línea resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 127.0.0.11 es el resolver interno de Docker.
    # Necesario para que nginx resuelva nombres de contenedores en runtime
    # y no falle al arrancar si el backend aún no está listo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API requests to the backend
    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Serve uploaded photos from the backend
    location /uploads/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # SPA fallback — all unknown routes return index.html (React Router handles them)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
